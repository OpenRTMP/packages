name: Publish package signing public keys

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-package-signing-public-keys
  cancel-in-progress: false

jobs:
  publish:
    name: Export and publish public keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Export APT public keys
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APT_GPG_PRIVATE_KEY}" ]]; then
            echo "APT_GPG_PRIVATE_KEY is required." >&2
            exit 1
          fi

          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          fingerprint="$(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          if [[ -z "$fingerprint" ]]; then
            echo "No secret GPG key was imported." >&2
            exit 1
          fi

          gpg --batch --yes --armor --export "$fingerprint" > openrtmp.asc
          gpg --batch --yes --export "$fingerprint" > openrtmp.gpg

          echo "Exported APT public key $fingerprint"

      - name: Publish Alpine public key
        env:
          ALPINE_RSA_PUBLIC_KEY: ${{ secrets.ALPINE_RSA_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ALPINE_RSA_PUBLIC_KEY}" ]]; then
            echo "ALPINE_RSA_PUBLIC_KEY is required." >&2
            exit 1
          fi

          printf '%s\n' "$ALPINE_RSA_PUBLIC_KEY" > openrtmp-alpine.rsa.pub

          if ! grep -q "BEGIN PUBLIC KEY" openrtmp-alpine.rsa.pub; then
            echo "ALPINE_RSA_PUBLIC_KEY does not look like a PEM public key." >&2
            exit 1
          fi

      - name: Commit public keys
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openrtmp.asc openrtmp.gpg openrtmp-alpine.rsa.pub

          if git diff --cached --quiet; then
            echo "Public signing keys are already up to date."
            exit 0
          fi

          git commit -m "Publish package signing public keys"
          git push origin main
