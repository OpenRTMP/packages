name: Build librtmp2 Windows packages

run-name: Build librtmp2 Windows ${{ github.event.inputs.version || github.event.client_payload.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "librtmp2 release version, for example 0.6.0 or v0.6.0"
        required: true
        type: string
      librtmp2_ref:
        description: >-
          Optional librtmp2 branch or commit to build instead of the v<version>
          tag. Validation only: such builds are tested and packaged but never
          published.
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [librtmp2-release]

env:
  RAW_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
  LIBRTMP2_REF: ${{ github.event.inputs.librtmp2_ref || '' }}

jobs:
  build:
    name: Windows / ${{ matrix.arch }}
    # Each architecture builds on a native runner so its tests and the DLL
    # load check run on the same CPU architecture the package targets.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows-static-md
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows-static-md

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_VERSION)) {
            throw "No librtmp2 version supplied."
          }
          $version = $env:RAW_VERSION.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Rust toolchain
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustup target add $env:RUST_TARGET
          rustc --version
          cargo --version

      - name: Install static OpenSSL
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root) -or -not (Test-Path "$root\vcpkg.exe")) {
            # Not every runner image ships vcpkg (e.g. Windows ARM64).
            $root = Join-Path $env:RUNNER_TEMP "vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }
          }
          & "$root\vcpkg.exe" install "openssl:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not install OpenSSL." }
          "VCPKG_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build librtmp2
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "librtmp2"
          if ([string]::IsNullOrWhiteSpace($env:LIBRTMP2_REF)) {
            git clone --depth 1 --branch "v$env:VERSION" https://github.com/OpenRTMP/librtmp2.git $source
          } else {
            git clone https://github.com/OpenRTMP/librtmp2.git $source
            git -C $source checkout --detach $env:LIBRTMP2_REF
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the librtmp2 source." }
          Set-Location $source

          # Releases before native Windows support cannot build here; fail
          # with a clear message instead of a page of compiler errors.
          if (-not (Test-Path "src\net\windows.rs")) {
            throw "This librtmp2 source has no Windows socket backend (src/net/windows.rs); Windows packages need a release with native Windows support."
          }

          $env:OPENSSL_DIR = Join-Path $env:VCPKG_ROOT_DIR "installed\$env:VCPKG_TRIPLET"
          $env:OPENSSL_STATIC = "1"

          cargo install --locked cbindgen
          New-Item -ItemType Directory -Force -Path "include\librtmp2" | Out-Null
          if (-not (Test-Path "include\librtmp2\librtmp2.h")) {
            cbindgen --lang c --cpp-compat --crate librtmp2 --output "include\librtmp2\librtmp2.h"
          }

          # librtmp2 library releases intentionally do not ship Cargo.lock.
          cargo build --release --target $env:RUST_TARGET

          $targetDir = Join-Path $source "target\$env:RUST_TARGET\release"
          if (-not (Test-Path (Join-Path $targetDir "librtmp2.dll"))) {
            throw "$targetDir\librtmp2.dll was not produced."
          }
          if (-not (Get-ChildItem $targetDir -Filter "librtmp2*.lib" -ErrorAction SilentlyContinue)) {
            throw "No librtmp2 import/static library was produced in $targetDir."
          }

      - name: Test librtmp2 on this architecture
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          # The release build's own unit and loopback integration tests,
          # including RTMP and RTMPS publish/play, on the package's CPU
          # architecture. A failure here stops the package from being made.
          Set-Location (Join-Path $env:GITHUB_WORKSPACE "librtmp2")
          $env:OPENSSL_DIR = Join-Path $env:VCPKG_ROOT_DIR "installed\$env:VCPKG_TRIPLET"
          $env:OPENSSL_STATIC = "1"
          cargo test --release --all-features --target $env:RUST_TARGET -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "librtmp2 tests failed." }

      - name: Create Windows package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "librtmp2"
          $targetDir = Join-Path $source "target\$env:RUST_TARGET\release"
          $output = Join-Path $env:GITHUB_WORKSPACE "artifact\windows\$env:ARCH\$env:VERSION"
          $stageName = "librtmp2-$env:VERSION-windows-$env:ARCH"
          $stage = Join-Path $env:RUNNER_TEMP $stageName

          @(
            (Join-Path $stage "bin"),
            (Join-Path $stage "lib"),
            (Join-Path $stage "include\librtmp2")
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Copy-Item (Join-Path $targetDir "librtmp2.dll") (Join-Path $stage "bin\")
          Get-ChildItem $targetDir -Filter "librtmp2*.lib" |
            Copy-Item -Destination (Join-Path $stage "lib\")
          Copy-Item (Join-Path $source "include\librtmp2\librtmp2.h") (Join-Path $stage "include\librtmp2\")
          Copy-Item (Join-Path $source "README.md") $stage
          Copy-Item (Join-Path $source "LICENSE") $stage

          $opensslLicense = Join-Path $env:VCPKG_ROOT_DIR "installed\$env:VCPKG_TRIPLET\share\openssl\copyright"
          if (-not (Test-Path $opensslLicense)) {
            throw "OpenSSL license notice was not found at $opensslLicense."
          }
          Copy-Item $opensslLicense (Join-Path $stage "OPENSSL-LICENSE.txt")

          $archive = Join-Path $output "$stageName.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $stageName.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Validate Windows package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Check the archive exactly as users get it: checksum, layout, and
          # the extracted DLL's architecture, dependencies and C ABI.
          $stageName = "librtmp2-$env:VERSION-windows-$env:ARCH"
          $archive = Join-Path $env:GITHUB_WORKSPACE "artifact\windows\$env:ARCH\$env:VERSION\$stageName.zip"
          $expected = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 file does not match the archive." }

          $extract = Join-Path $env:RUNNER_TEMP "validate-$env:ARCH"
          Expand-Archive $archive -DestinationPath $extract -Force
          $root = Join-Path $extract $stageName
          $required = @(
            "bin\librtmp2.dll",
            "lib\librtmp2.dll.lib",
            "lib\librtmp2.lib",
            "include\librtmp2\librtmp2.h",
            "README.md",
            "LICENSE",
            "OPENSSL-LICENSE.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $root $file))) { throw "Package is missing $file." }
          }
          Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize

          $smoke = Join-Path $env:GITHUB_WORKSPACE "librtmp2\scripts\windows-dll-smoke.ps1"
          if (-not (Test-Path $smoke)) { throw "librtmp2 source has no scripts/windows-dll-smoke.ps1." }
          & $smoke -Dll (Join-Path $root "bin\librtmp2.dll") -Arch $env:ARCH

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: librtmp2-windows-${{ matrix.arch }}
          path: artifact
          if-no-files-found: error

  publish:
    name: Update Windows packages
    needs: build
    # Builds of an explicit librtmp2_ref are validation runs: never publish.
    if: needs.build.result == 'success' && (github.event.inputs.librtmp2_ref || '') == ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: librtmp2-repository-publish
      cancel-in-progress: false

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download Windows package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: librtmp2-windows-*
          path: downloaded-windows
          merge-multiple: true

      - name: Check for built packages
        id: packages
        shell: bash
        run: |
          if [[ -d downloaded-windows/windows ]] \
              && find downloaded-windows/windows -type f -name '*.zip' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Successful Windows package artifacts are available for publishing."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No successful Windows package artifacts are available; nothing to publish."
          fi

      - name: Import signing key and sign packages
        if: steps.packages.outputs.available == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APT_GPG_PRIVATE_KEY" ]] || { echo "APT_GPG_PRIVATE_KEY is required." >&2; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "$KEY_FINGERPRINT" ]]

          gpg --batch --yes --armor --export "$KEY_FINGERPRINT" > openrtmp.asc
          gpg --batch --yes --export "$KEY_FINGERPRINT" > openrtmp.gpg

          while IFS= read -r -d '' package; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$KEY_FINGERPRINT" \
              --armor --detach-sign \
              --output "$package.asc" "$package"
          done < <(find downloaded-windows/windows -type f -name '*.zip' -print0)

      - name: Publish Windows packages
        if: steps.packages.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows
          cp -a downloaded-windows/windows/. windows/

      - name: Commit repository update
        id: publish
        if: steps.packages.outputs.available == 'true'
        env:
          VERSION: ${{ env.RAW_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows openrtmp.asc openrtmp.gpg

          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Windows packages are already up to date."
            exit 0
          fi

          git commit -m "Publish librtmp2 ${VERSION#v} Windows packages"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated repository to Pages
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run page-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
