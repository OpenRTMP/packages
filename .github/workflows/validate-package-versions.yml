name: Validate package versioning

on:
  pull_request:
    paths:
      - '.github/workflows/build-librtmp2-*.yml'
      - '.github/workflows/validate-package-versions.yml'
      - 'scripts/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-librtmp2-*.yml'
      - '.github/workflows/validate-package-versions.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    name: Native package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The repository contains many large published package binaries;
          # validation needs scripts only, not a full packages checkout.
          sparse-checkout: |
            scripts
            .github/workflows

      - name: Check Bash script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Test package completeness regressions
        shell: bash
        run: bash scripts/test-package-completeness-regressions.sh

      - name: Check native version templates
        shell: bash
        run: |
          set -euo pipefail
          # These native formats intentionally differ across package managers.
          grep -Fq 'PACKAGE_VERSION="${VERSION}-${DEB_REVISION}~${CODENAME}1"' scripts/build-librtmp2-deb.sh
          grep -Fq 'PACKAGE_VERSION="${VERSION}-${DEB_REVISION}~${CODENAME}1"' scripts/test-librtmp2-deb.sh
          grep -Fq 'Release:        $RPM_RELEASE.$RELEASE_TAG' scripts/build-librtmp2-rpm.sh
          grep -Fq 'pkgver=$VERSION' scripts/build-librtmp2-apk.sh
          grep -Fq 'pkgrel=$PKGREL' scripts/build-librtmp2-apk.sh
          grep -Fq 'pkgrel=@PKGREL@' scripts/build-librtmp2-arch.sh

      - name: Check APT publish gate
        shell: bash
        run: |
          set -euo pipefail
          # One failed emulated leg must not discard every other
          # architecture's packages; completeness is enforced by the
          # repository checker, not by the matrix result.
          grep -Fq "if: always() && needs.build.result != 'cancelled'" \
            .github/workflows/build-librtmp2-packages.yml
          grep -Fq "continue-on-error:" \
            .github/workflows/build-librtmp2-packages.yml
          grep -Fq "needs.build.result != 'success'" \
            .github/workflows/build-librtmp2-packages.yml
          # Metadata generation, key import, signing and the commit must each
          # carry the no-op gate; a single occurrence could leave one of them
          # rewriting metadata on a retry. Extract each step's own if-line
          # instead of counting matches anywhere in the file.
          step_if() {
            awk -v name="$1" '
              $0 ~ "- name: " name { found = 1; next }
              found && /^[[:space:]]*- name:/ { exit 1 }
              found && /^[[:space:]]+if:/ { print; exit 0 }
            ' .github/workflows/build-librtmp2-packages.yml
          }
          normalized_if() {
            sed -E 's/^[[:space:]]*if:[[:space:]]*//; s/[[:space:]]+#.*$//; s/\r$//'
          }
          for step in \
            "Generate APT metadata" \
            "Import signing key" \
            "Sign Debian and Ubuntu metadata" \
            "Commit repository update"
          do
            guard="$(step_if "$step" | normalized_if)"
            [[ "$guard" == "steps.packages.outputs.available == 'true' && steps.sort.outputs.changed == 'true'" ]]
          done
          pages_guard="$(step_if "Deploy updated repository to Pages" | normalized_if)"
          [[ "$pages_guard" == "steps.packages.outputs.available == 'true'" ]]

      - name: Verify Debian package upgrade ordering
        shell: bash
        run: |
          set -euo pipefail
          # Existing repository packages through 0.15.0 use the old + suffix.
          dpkg --compare-versions '0.17.1-1~resolute1' gt '0.15.0-1+resolute1'
          # Keep the one-time downgrade caveat for the *same* upstream version.
          dpkg --compare-versions '0.17.1-1~resolute1' lt '0.17.1-1+resolute1'
          # New upstream versions supersede packaging-only rebuilds.
          dpkg --compare-versions '0.18.0-1~resolute1' gt '0.17.1-2~resolute1'
          # PPA releases with an upload suffix sort above the regular repo
          # when the upstream version, Debian revision and series match.
          dpkg --compare-versions '0.17.1-1~resolute15r1' gt '0.17.1-1~resolute1'
