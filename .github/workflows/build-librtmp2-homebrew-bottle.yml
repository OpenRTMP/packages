name: Build librtmp2 Homebrew Bottle

run-name: Build librtmp2 Homebrew Bottle ${{ github.event.inputs.version || github.event.client_payload.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "librtmp2 release version, for example 0.6.0 or v0.6.0"
        required: true
        type: string
  repository_dispatch:
    types: [librtmp2-release]

concurrency:
  group: librtmp2-homebrew-bottle-repository
  cancel-in-progress: false

env:
  RAW_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}

jobs:
  build:
    name: ${{ matrix.macos }} (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { macos: sequoia, tag: arm64_sequoia, runner: macos-15 }
          - { macos: tahoe, tag: arm64_tahoe, runner: macos-26 }
          - { macos: golden_gate, tag: arm64_golden_gate, runner: xcode-27 }
          - { macos: sequoia, tag: sequoia, runner: macos-15-intel }
          - { macos: tahoe, tag: tahoe, runner: macos-26-intel }

    steps:
      - name: Checkout package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRTMP/homebrew-tap
          ref: main
          path: homebrew-tap
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RAW_VERSION:-}" ]] || { echo "No librtmp2 version supplied." >&2; exit 1; }
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Homebrew formula targets this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORMULA_DIR: ${{ github.workspace }}/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/check-librtmp2-additional-package-completeness.sh
          scripts/check-librtmp2-additional-package-completeness.sh homebrew

      - name: Tap the Homebrew tap checkout
        run: brew tap openrtmp/tap "$PWD/homebrew-tap"

      - name: Build and bottle librtmp2
        id: bottle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          brew install --formula --build-bottle openrtmp/tap/librtmp2
          brew test openrtmp/tap/librtmp2
          brew bottle --no-rebuild --json \
            --root-url "https://packages.openrtmp.org/homebrew/librtmp2/${VERSION}" \
            openrtmp/tap/librtmp2

          json="$(find . -maxdepth 1 -name 'librtmp2--*.json' -print -quit)"
          tarball="$(find . -maxdepth 1 -name 'librtmp2--*.tar.gz' -print -quit)"
          [[ -n "$json" && -n "$tarball" ]] || {
            echo "brew bottle did not produce the expected tarball/json." >&2
            exit 1
          }

          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload bottle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: librtmp2-bottle-${{ matrix.tag }}
          path: |
            ${{ steps.bottle.outputs.tarball }}
            ${{ steps.bottle.outputs.json }}
          if-no-files-found: error

  publish:
    name: Publish Homebrew bottles
    needs: build
    if: needs.build.result == 'success'
    runs-on: macos-26
    permissions:
      actions: write
      contents: write
    concurrency:
      group: librtmp2-repository-publish
      cancel-in-progress: false

    steps:
      - name: Checkout package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      # Pushing to the tap needs the HOMEBREW_TAP_TOKEN secret; github.token
      # can only write to this repository.
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRTMP/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RAW_VERSION:-}" ]] || { echo "No librtmp2 version supplied." >&2; exit 1; }
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download bottle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: librtmp2-bottle-*
          path: bottles
          merge-multiple: true

      - name: Check for built bottles
        id: bottles
        shell: bash
        run: |
          if find bottles -maxdepth 1 -name '*.tar.gz' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Bottle artifacts are available for publishing."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No bottle artifacts are available; nothing to publish."
          fi

      - name: Tap and trust the Homebrew tap checkout
        if: steps.bottles.outputs.available == 'true'
        run: |
          brew tap openrtmp/tap "$PWD/homebrew-tap"
          brew trust --formula openrtmp/tap/librtmp2

      - name: Merge bottle metadata into formula
        if: steps.bottles.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd bottles
            brew bottle \
              --merge --write --no-commit \
              --root-url "https://packages.openrtmp.org/homebrew/librtmp2/${VERSION}" \
              ./*.json
          )

          tap_formula="$(brew --repo openrtmp/tap)/Formula/librtmp2.rb"
          cp "$tap_formula" homebrew-tap/Formula/librtmp2.rb

      - name: Move bottles into the package repository
        if: steps.bottles.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dest="homebrew/librtmp2/${VERSION}"
          mkdir -p "$dest"

          # `brew bottle` names its output with a double dash
          # (librtmp2--0.8.0...), but `brew install` requests the bottle
          # from root_url using a single dash (librtmp2-0.8.0...) -
          # rename to match what it will actually fetch.
          for bottle in bottles/*.tar.gz; do
            mv "$bottle" "$dest/$(basename "${bottle/--/-}")"
          done

      - name: Commit bottle update
        id: publish
        if: steps.bottles.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "homebrew/librtmp2/${VERSION}"

          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Homebrew bottles are already up to date."
            exit 0
          fi

          git commit -m "Publish Homebrew bottles for librtmp2 $VERSION"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated repository to Pages
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run page-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      # The formula's bottle block must never point at bottles that
      # packages.openrtmp.org doesn't serve yet, so wait for the Pages deploy.
      - name: Wait for bottles on packages.openrtmp.org
        if: steps.bottles.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for bottle in "homebrew/librtmp2/${VERSION}"/*.tar.gz; do
            url="https://packages.openrtmp.org/${bottle}"
            for _ in $(seq 1 60); do
              if curl --fail --head --silent --show-error --location \
                  --proto '=https' --tlsv1.2 "$url" > /dev/null; then
                echo "Available: $url"
                continue 2
              fi
              sleep 20
            done
            echo "Bottle is still not served after 20 minutes: $url" >&2
            exit 1
          done

      - name: Commit formula update to the Homebrew tap
        if: steps.bottles.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/librtmp2.rb

          if git diff --cached --quiet; then
            echo "Homebrew bottle metadata is already up to date."
            exit 0
          fi

          git commit -m "Add bottles for librtmp2 $VERSION"
          git push origin main
