name: Check for new librtmp2 release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: check-librtmp2-release
  cancel-in-progress: false

jobs:
  check:
    name: Check latest release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      apt_needed: ${{ steps.status.outputs.apt_needed }}
      alpine_needed: ${{ steps.status.outputs.alpine_needed }}
      rpm_needed: ${{ steps.status.outputs.rpm_needed }}
      arch_needed: ${{ steps.status.outputs.arch_needed }}
      homebrew_needed: ${{ steps.status.outputs.homebrew_needed }}
      windows_needed: ${{ steps.status.outputs.windows_needed }}

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve latest librtmp2 release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api repos/OpenRTMP/librtmp2/releases/latest --jq '.tag_name')"
          if [[ -z "$tag" ]]; then
            echo "No published librtmp2 release was found." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest published librtmp2 release: $tag"

      - name: Check repositories and running workflows
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x \
            scripts/check-librtmp2-package-completeness.sh \
            scripts/check-librtmp2-additional-package-completeness.sh

          running_count() {
            local workflow="$1"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length'
          }

          target_status() {
            local target="$1"
            local workflow="$2"
            local checker="$3"
            local published=false
            local running
            local needed=true

            if "$checker" "$target"; then
              published=true
            fi
            running="$(running_count "$workflow")"
            if [[ "$published" == true || "$running" -gt 0 ]]; then
              needed=false
            fi

            echo "${target}_needed=$needed" >> "$GITHUB_OUTPUT"
            echo "$target: complete=$published running=$running needed=$needed"
          }

          target_status apt build-librtmp2-packages.yml scripts/check-librtmp2-package-completeness.sh
          target_status alpine build-librtmp2-alpine.yml scripts/check-librtmp2-package-completeness.sh
          target_status rpm build-librtmp2-rpm.yml scripts/check-librtmp2-additional-package-completeness.sh
          target_status arch build-librtmp2-arch.yml scripts/check-librtmp2-additional-package-completeness.sh
          target_status homebrew update-librtmp2-homebrew.yml scripts/check-librtmp2-additional-package-completeness.sh
          target_status windows build-librtmp2-windows.yml scripts/check-librtmp2-additional-package-completeness.sh

  dispatch-apt:
    name: Start APT package workflow
    needs: check
    if: needs.check.outputs.apt_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch APT build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run build-librtmp2-packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  dispatch-alpine:
    name: Start Alpine package workflow
    needs: check
    if: needs.check.outputs.alpine_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Alpine build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run build-librtmp2-alpine.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  dispatch-rpm:
    name: Start RPM package workflow
    needs: check
    if: needs.check.outputs.rpm_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch RPM build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run build-librtmp2-rpm.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  dispatch-arch:
    name: Start Arch Linux package workflow
    needs: check
    if: needs.check.outputs.arch_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Arch Linux build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run build-librtmp2-arch.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  dispatch-homebrew:
    name: Start Homebrew formula workflow
    needs: check
    if: needs.check.outputs.homebrew_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Homebrew update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run update-librtmp2-homebrew.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  dispatch-windows:
    name: Start Windows package workflow
    needs: check
    if: needs.check.outputs.windows_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run build-librtmp2-windows.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  summary:
    name: Release check summary
    needs:
      - check
      - dispatch-apt
      - dispatch-alpine
      - dispatch-rpm
      - dispatch-arch
      - dispatch-homebrew
      - dispatch-windows
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## librtmp2 release check"
            echo
            echo "- Release: \`${{ needs.check.outputs.tag }}\`"
            echo "- APT build required: \`${{ needs.check.outputs.apt_needed }}\`"
            echo "- Alpine build required: \`${{ needs.check.outputs.alpine_needed }}\`"
            echo "- RPM build required: \`${{ needs.check.outputs.rpm_needed }}\`"
            echo "- Arch Linux build required: \`${{ needs.check.outputs.arch_needed }}\`"
            echo "- Homebrew update required: \`${{ needs.check.outputs.homebrew_needed }}\`"
            echo "- Windows build required: \`${{ needs.check.outputs.windows_needed }}\`"
            echo
            echo "A target is considered published only when its configured package artifacts and repository metadata are present."
          } >> "$GITHUB_STEP_SUMMARY"
